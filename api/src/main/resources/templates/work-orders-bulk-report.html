<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Relatorio em Massa de Ordens de Servico</title>
    <th:block th:insert="~{fragments/work-order-report-styles :: styles}"></th:block>
</head>
<body>
<!--@thymesVar id="workOrderReports" type="java.util.List<java.util.Map>"-->
<!--@thymesVar id="customerLabel" type="java.lang.String"-->
<!--@thymesVar id="cityLabel" type="java.lang.String"-->
<!--@thymesVar id="cnpjLabel" type="java.lang.String"-->

<!-- Capa - resumo do lote, nao e' uma OS. Usa o mesmo vocabulario visual
     (doc-title/section-label/kv-*) do corpo de cada OS, pra nao introduzir
     uma segunda linguagem visual so' pra capa. -->
<div class="header">
    <table class="brand-row">
        <tr>
            <td class="brand-left">
                <div class="doc-title">Relatorio em Massa</div>
                <div class="doc-subtitle">Ordens de servico concluidas no periodo</div>
                <div class="company-name" th:text="${companyName}">Empresa</div>
            </td>
            <td class="brand-right">
                <img th:if="${erioneLogoDataUri != null}" th:src="${erioneLogoDataUri}" class="logo"/>
            </td>
        </tr>
    </table>
    <div class="header-rule"></div>
</div>

<table class="summary-row">
    <tr>
        <td class="summary-code-cell">
            <div class="summary-code-label">Cliente</div>
            <div class="summary-code-value" style="font-size:13pt" th:text="${customerLabel}">Cliente</div>
        </td>
        <td class="summary-stat-cell">
            <div class="summary-label">Cidade</div>
            <div class="summary-value" th:text="${cityLabel == null or #strings.isEmpty(cityLabel) ? '' : cityLabel}"></div>
        </td>
        <td class="summary-stat-cell">
            <div class="summary-label">CNPJ</div>
            <div class="summary-value" th:text="${cnpjLabel == null or #strings.isEmpty(cnpjLabel) ? '' : cnpjLabel}"></div>
        </td>
        <td class="summary-stat-cell">
            <div class="summary-label">Periodo</div>
            <div class="summary-value" th:text="${periodStart} + ' a ' + ${periodEnd}"></div>
        </td>
        <td class="summary-stat-cell">
            <div class="summary-label">Total de OS</div>
            <div class="summary-value" th:text="${#lists.size(workOrderReports)}"></div>
        </td>
    </tr>
</table>

<div class="cover-rule"></div>

<div class="wo-block" th:each="wo, iter : ${workOrderReports}" th:classappend="${iter.first} ? '' : 'page-break'">
    <div class="wo-index" th:text="'OS ' + (${iter.index} + 1) + ' DE ' + ${#lists.size(workOrderReports)}"></div>
    <div th:with="workOrder=${wo.workOrder},
                  primaryUserName=${wo.primaryUserName},
                  customers=${wo.customers},
                  customerCnpj=${wo.customerCnpj},
                  customerEmail=${wo.customerEmail},
                  customerPhone=${wo.customerPhone},
                  customerAddress=${wo.customerAddress},
                  serviceLabel=${wo.serviceLabel},
                  tasks=${wo.tasks},
                  tasksImagesUrls=${wo.tasksImagesUrls},
                  fieldReports=${wo.fieldReports},
                  fieldEvidenceRows=${wo.fieldEvidenceRows},
                  fieldEvidenceCount=${wo.fieldEvidenceCount},
                  locationIdentification=${wo.locationIdentification},
                  locationAddressWithReference=${wo.locationAddressWithReference},
                  checkInDistanceLabel=${wo.checkInDistanceLabel},
                  checkOutDistanceLabel=${wo.checkOutDistanceLabel},
                  siteDurationLabel=${wo.siteDurationLabel}">
        <div th:replace="~{fragments/work-order-report-body :: workOrderBody}"></div>
    </div>
</div>

</body>
</html>
