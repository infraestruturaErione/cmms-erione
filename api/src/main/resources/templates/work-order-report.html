<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ordem de Serviço</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; font-size: 11px; color: #333; margin: 20px; }
        h3 { margin: 0 0 6px 0; font-size: 15px; }
        h4 { margin: 0 0 4px 0; font-size: 13px; }
        hr { border: none; border-top: 1px solid #ccc; margin: 12px 0; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 3px 6px; vertical-align: top; }
        .section { margin-bottom: 18px; }
        .section-title { background-color: #2B8F7E; color: #fff; padding: 6px 10px; font-size: 13px; font-weight: bold; }
        .label { font-weight: bold; color: #555; white-space: nowrap; }
        .value { color: #333; }
        .item { padding: 4px 0; }
        .item + .item { border-top: 1px solid #eee; }
        .footer { text-align: center; padding-top: 12px; margin-top: 12px; border-top: 1px solid #ccc; font-size: 10px; color: #888; }
        .header-right { text-align: right; }
        img { max-width: 100%; }
        .logo { margin-bottom: 6px; }
        .left-col { width: 50%; }
        .right-col { width: 50%; }
    </style>
</head>
<body>
<!--@thymesVar id="workOrder" type="com.grash.model.WorkOrder"-->
<!--/*@thymesVar id="backgroundColor" type="java.lang.String"*/-->
<!--@thymesVar id="companyName" type="java.lang.String"-->
<!--@thymesVar id="companyLogo" type="java.lang.String"-->
<!--/*@thymesVar id="relations" type="java.util.List<com.grash.model.Relation>"*/-->
<!--/*@thymesVar id="tasks" type="java.util.List<com.grash.model.Task>"*/-->
<!--/*@thymesVar id="tasksImagesUrls" type="java.util.Map<java.lang.Long, java.lang.String[]>"*/-->
<!--/*@thymesVar id="assignedTo" type="java.lang.String"*/-->
<!--/*@thymesVar id="customers" type="java.lang.String"*/-->
<!--/*@thymesVar id="companyPhone" type="java.lang.String"*/-->
<!--/*@thymesVar id="primaryUserName" type="java.lang.String"*/-->
<!--/*@thymesVar id="currency" type="java.lang.String"*/-->
<!--/*@thymesVar id="additionalCosts" type="java.util.List<com.grash.model.AdditionalCost>"*/-->
<!--/*@thymesVar id="workOrderHistories" type="java.util.List<com.grash.model.WorkOrderHistory>"*/-->
<!--/*@thymesVar id="partQuantities" type="java.util.List<com.grash.model.PartQuantity>"*/-->
<!--/*@thymesVar id="labors" type="java.util.List<com.grash.model.Labor>"*/-->
<!--/*@thymesVar id="messageSource" type="org.springframework.context.MessageSource"*/-->
<!--/*@thymesVar id="locale" type="java.util.Locale"*/-->
<!--/*@thymesVar id="utils" type="com.grash.utils.Utils"*/-->
<!--/*@thymesVar id="dateFormat" type="java.lang.String"*/-->
<!--/*@thymesVar id="timeZone" type="java.lang.String"*/-->

<h3 th:text="${companyName}"></h3>
<img th:if="${companyLogo!=null}" th:src="@{${companyLogo}}" height="40" class="logo"/>
<h3 th:style="'color:'+${backgroundColor}" th:text="#{wo_number(${workOrder.customId})}" style="float:right"></h3>
<hr/>

<table>
    <tr>
        <td class="left-col">
            <div th:text="${companyPhone}"></div>
            <strong th:text="#{created_at}+': '"></strong><span th:text="${utils.getFormattedDate(workOrder.createdAt, dateFormat, timeZone)}"></span><br/>
            <strong th:text="#{last_updated}+': '"></strong><span th:text="${utils.getFormattedDate(workOrder.updatedAt, dateFormat, timeZone)}"></span>
        </td>
        <td class="right-col">
            <div th:if="${primaryUserName}">
                <strong th:text="#{assigned_to}+': '"></strong><span th:text="${primaryUserName}"></span><br/>
            </div>
            <div th:if="${workOrder.dueDate}">
                <strong th:text="#{due_date}+': '"></strong><span th:text="${workOrder.dueDate}"></span><br/>
            </div>
            <div th:if="${workOrder.status}">
                <strong th:text="#{status}+': '"></strong><span th:text="#{${workOrder.status}}"></span><br/>
            </div>
            <div th:if="${workOrder.priority}">
                <strong th:text="#{priority}+': '"></strong><span th:text="#{${workOrder.priority}}"></span>
            </div>
        </td>
    </tr>
</table>

<div class="section">
    <div class="section-title" th:text="#{work_order}"></div>
    <h4 th:text="${workOrder.title}"></h4>
    <div th:text="${workOrder.description}"></div>
</div>

<div class="section">
    <div class="section-title" th:text="#{details}"></div>
    <table>
        <tr>
            <td class="left-col">
                <div th:if="${workOrder.location}"><span class="label" th:text="#{location}+': '"></span><span class="value" th:text="${workOrder.location.name}"></span></div>
                <div th:if="${workOrder.asset}"><span class="label" th:text="#{asset}+': '"></span><span class="value" th:text="|${workOrder.asset.name}${!#strings.isEmpty(workOrder.asset.serialNumber) ? ' (' + workOrder.asset.serialNumber + ')' : ''}|"></span></div>
                <div th:if="${workOrder.estimatedDuration}"><span class="label" th:text="#{estimated_duration}+': '"></span><span class="value" th:text="${workOrder.estimatedDuration}"></span></div>
                <div th:if="${workOrder.team}"><span class="label" th:text="#{team}+': '"></span><span class="value" th:text="${workOrder.team.name}"></span></div>
                <div th:if="${workOrder.category}"><span class="label" th:text="#{category}+': '"></span><span class="value" th:text="${workOrder.category.name}"></span></div>
            </td>
            <td class="right-col">
                <div th:if="${!#strings.isEmpty(assignedTo)}"><span class="label" th:text="#{assigned_to}+': '"></span><span class="value" th:text="${assignedTo}"></span></div>
                <div th:if="${!#strings.isEmpty(customers)}"><span class="label" th:text="#{customers}+': '"></span><span class="value" th:text="${customers}"></span></div>
                <div th:if="${workOrder.completedBy}"><span class="label" th:text="#{completed_by}+': '"></span><span class="value" th:text="${workOrder.completedBy.getFullName()}"></span></div>
                <div th:if="${workOrder.completedOn}"><span class="label" th:text="#{completed_on}+': '"></span><span class="value" th:text="${utils.getFormattedDate(workOrder.completedOn, dateFormat, timeZone)}"></span></div>
                <div th:if="${workOrder.feedback}"><span class="label" th:text="#{feedback}+': '"></span><span class="value" th:text="${workOrder.feedback}"></span></div>
            </td>
        </tr>
    </table>
</div>

<div class="section" th:if="${not #lists.isEmpty(tasks)}">
    <div class="section-title" th:text="#{tasks}"></div>
    <th:block th:each="task : ${tasks}">
        <div class="item">
            <strong th:text="${task.getTaskBase().getLabel()}"></strong>
            <div th:text="${task.getTranslatedValue(locale, messageSource)}"></div>
            <div style="font-size:10px" th:text="${task.getNotes()}"></div>
            <th:block th:each="imageUrl : ${tasksImagesUrls.get(task.getId())}">
                <img th:src="${imageUrl}" height="200"/>
            </th:block>
        </div>
    </th:block>
</div>

<div class="section" th:if="${not #lists.isEmpty(labors)}">
    <div class="section-title" th:text="#{labors}"></div>
    <th:block th:each="labor : ${labors}">
        <div class="item">
            <div><span class="label" th:text="#{user}+': '"></span><span class="value" th:text="${labor.getAssignedTo() == null ? '' : labor.getAssignedTo().getFullName()}"></span></div>
            <div><span class="label" th:text="#{duration}+': '"></span><span class="value" th:text="#{format_date(${labor.getFormattedDuration().get(0)},${labor.getFormattedDuration().get(1)},${labor.getFormattedDuration().get(2)})}"></span></div>
            <div><span class="label" th:text="#{cost}+': '"></span><span class="value" th:text="${labor.getCost()}+' '+ ${currency}"></span></div>
        </div>
    </th:block>
</div>

<div class="section" th:if="${not #lists.isEmpty(relations)}">
    <div class="section-title" th:text="#{relations}"></div>
    <th:block th:each="relation : ${relations}">
        <div class="item" th:text="${relation.getParent().getTitle()} + ' ' + #{${relation.getRelationType()}} + ' ' + ${relation.getChild().getTitle()}"></div>
    </th:block>
</div>

<div class="section" th:if="${not #lists.isEmpty(additionalCosts)}">
    <div class="section-title" th:text="#{additional_costs}"></div>
    <th:block th:each="additionalCost : ${additionalCosts}">
        <div class="item" th:text="${additionalCost.getDescription()} + ': ' + ${additionalCost.getCost()} + ' ' + ${currency}"></div>
    </th:block>
</div>

<div class="section" th:if="${not #lists.isEmpty(workOrderHistories)}">
    <div class="section-title" th:text="#{history}"></div>
    <th:block th:each="workOrderHistory : ${workOrderHistories}">
        <div class="item">
            <div><span class="label" th:text="#{user}+': '"></span><span class="value" th:text="${workOrderHistory.getUser().getFullName()}"></span></div>
            <div th:text="${workOrderHistory.getName()}"></div>
            <div th:text="${utils.getFormattedDate(workOrderHistory.getCreatedAt(), dateFormat, timeZone)}"></div>
        </div>
    </th:block>
</div>

<div class="section" th:if="${not #lists.isEmpty(partQuantities)}">
    <div class="section-title" th:text="#{parts}"></div>
    <th:block th:each="partQuantity : ${partQuantities}">
        <div class="item">
            <strong th:text="${partQuantity.getPart().getName()}"></strong>
            <div><span class="label" th:text="#{quantity}+': '"></span><span class="value" th:text="${partQuantity.getQuantity()}"></span></div>
            <div><span class="label" th:text="#{cost}+': '"></span><span class="value" th:text="${partQuantity.getCost()}+' '+ ${currency}"></span></div>
        </div>
    </th:block>
</div>

<table>
    <tr>
        <td class="left-col">
            <span class="label" th:text="#{signature}+': '"></span><br/>
            <img th:if="${workOrder.signature!=null}" th:src="@{${workOrder.signature}}" height="100"/>
        </td>
        <td class="right-col">
            <span class="label" th:text="#{date}+': '"></span><br/>
            <span th:if="${workOrder.signature!=null && workOrder.completedOn!=null}" th:text="${utils.getFormattedDate(workOrder.completedOn, dateFormat, timeZone)}"></span>
        </td>
    </tr>
</table>
<br/>

<div class="footer">
    <span>Erione CMMS</span><br/>
    <img th:if="${companyLogo!=null}" th:src="@{${companyLogo}}" height="40" style="margin-top:8px"/>
</div>
</body>
</html>
